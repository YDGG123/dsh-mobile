name: Build unsigned IPA

# 在云端 macOS runner 上编译 iOS App 并产出未签名 IPA。
# 未签名包需要用 Sideloadly / AltStore / TrollStore 等工具自行签名后安装。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build IPA
    # macOS 15 runner 才带 iOS 26 SDK(编译 Liquid Glass API 必需)。
    # macOS 14 及更早镜像最高只有 Xcode 16.x，会因缺少 SDK 直接失败。
    runs-on: macos-15
    timeout-minutes: 90

    # 公开仓库的 macOS runner 队列在高峰时段可能长时间分配不到机器,
    # 任务会在 15 分钟后被系统取消。这里自动重跑最多 3 次。
    strategy:
      fail-fast: false
      max-parallel: 1
      # 仅失败/取消时重试 1 次（GitHub 的 max-parallel 与下方 job 内重跑逻辑配合）。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 需要 iOS 26 SDK 编译 Liquid Glass API：只接受 Xcode 26+，
          # 否则直接失败，避免拿到旧 Xcode 时给出难懂的 SPM 报错。
          echo "=== 可用的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""
          XCODE_VERSION=""
          for dir in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            ver=$("$dir/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
            major=${ver%%.*}
            echo "  $dir -> Xcode ${ver:-unknown}"
            # 26 及更高才够用;取其中版本最高的
            if [ -n "$major" ] && [ "$major" -ge 26 ] 2>/dev/null; then
              if [ -z "$XCODE_VERSION" ] || [ "$(printf '%s\n' "$ver" "$XCODE_VERSION" | sort -V | tail -1)" = "$ver" ]; then
                XCODE_APP="$dir"
                XCODE_VERSION="$ver"
              fi
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "::error::未找到 Xcode 26+（项目需要 iOS 26 SDK）。请改用 macos-15 runner。"
            exit 1
          fi

          echo "Using: $XCODE_APP (Xcode $XCODE_VERSION)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Show available simulators and SDKs
        run: |
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify iOS deployment target
        run: |
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' DeepSeekHarnessMobile.xcodeproj/project.pbxproj

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          echo "Configuration: $CONFIG"

          # 未签名归档：关闭所有签名，让 xcodebuild 只做编译和打包
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DshMobile.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DshMobile.xcarchive/Products/Applications/DshMobile.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 app 产物，检查 archive 日志"
            find "$RUNNER_TEMP/DshMobile.xcarchive" -maxdepth 4 -name "*.app" || true
            exit 1
          fi

          echo "=== app 内容 ==="
          ls -la "$APP" | head -30

          # 校验部署目标确实是 16.0
          echo "=== MinimumOSVersion ==="
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "=== 架构 ==="
          lipo -info "$APP/DshMobile" || true

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry DshMobile-unsigned.ipa Payload
          ls -lh DshMobile-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DshMobile-unsigned-ipa
          path: ${{ runner.temp }}/DshMobile-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/archive.log
          retention-days: 7
          if-no-files-found: ignore
